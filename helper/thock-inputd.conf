# thock-inputd settings. Restart the service after a change:
#   sudo systemctl restart thock-inputd

# The desktop user whose Thock may receive events (only this user can connect).
user = CHANGE_ME

# coarse (default): letter, digit and symbol keys are sent only as one of five keyboard zones,
#   so whatever reads the socket cannot tell what you typed. Sounds are the same for every pack
#   except Buckling Spring, which has a recording per key (it then plays the zone's recording).
# exact: the real key code, for Buckling Spring's per-key sounds. Any program you run could then
#   read your keystrokes from the socket while your session is unlocked.
detail = coarse
